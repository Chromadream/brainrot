name: Publish on GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "00 00 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: Test the playlist feed. Does not write data.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh playlist data
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Deno environment
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Probe the feed
        if: inputs.probe
        continue-on-error: true
        run: deno task refresh --probe

      - name: Fetch playlist data
        run: deno task refresh

      - name: Commit playlist data
        run: |
          if git diff --quiet -- _data/youtube.json; then
            echo "The playlist data did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/youtube.json
          git commit -m "chore: refresh playlist data [skip ci]"
          git push

  build:
    name: Build site
    needs: refresh
    if: always() && needs.refresh.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Deno environment
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Build site
        run: deno task build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
